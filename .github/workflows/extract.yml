name: Extract ZIP to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP" -d extracted

          echo "=== ZIP CONTENT ==="
          find extracted -maxdepth 3 -print

      - name: Merge ZIP into repository
        run: |
          # Cek apakah ZIP punya satu folder pembungkus
          DIRS=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$DIRS" = "1" ] && [ "$FILES" = "0" ]; then
            ROOT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            echo "Wrapper folder detected: $ROOT_DIR"

            rsync -av "$ROOT_DIR"/ ./
          else
            echo "No wrapper folder detected"

            rsync -av extracted/ ./
          fi

      - name: Remove ZIP
        run: |
          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Merge Builder update from ZIP"
          git push
